lavalink:
    plugins:
        - dependency: dev.lavalink.youtube:youtube-plugin:f45bbb7aebfcbc1c553769e04af6cd43afa8b7c3
          repository: https://maven.lavalink.dev/snapshots
          snapshot: true
        - dependency: com.github.topi314.lavasrc:lavasrc-plugin:4.8.3
          repository: https://maven.lavalink.dev/releases
          snapshot: false
        - dependency: com.github.topi314.lavasearch:lavasearch-plugin:1.0.0
          repository: https://maven.lavalink.dev/releases
          snapshot: false

    server:
        bufferDurationMs: 400
        filters:
            channelMix: true
            distortion: true
            equalizer: true
            karaoke: true
            lowPass: true
            rotation: true
            timescale: true
            tremolo: true
            vibrato: true
            volume: true
        frameBufferDurationMs: 5000
        gc-warnings: true
        opusEncodingQuality: 5
        password: "${LAVALINK_SERVER_PASSWORD}"
        playerUpdateInterval: 5
        resamplingQuality: HIGH
        soundcloudSearchEnabled: true
        sources:
            bandcamp: true
            http: true
            local: false
            nico: true
            soundcloud: true
            twitch: true
            vimeo: true
            youtube: false
        timeouts:
            connectTimeoutMs: 60000
            connectionRequestTimeoutMs: 60000
            socketTimeoutMs: 60000
        trackStuckThresholdMs: 10000
        useSeekGhosting: true
        youtubePlaylistLoadLimit: 6
        youtubeSearchEnabled: true

logging:
    file:
        path: ./logs/
    level:
        dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
        lavalink: INFO
        root: INFO
    logback:
        rollingpolicy:
            max-file-size: 1GB
            max-history: 30
    request:
        enabled: true
        includeClientInfo: true
        includeHeaders: false
        includePayload: false
        includeQueryString: true
        maxPayloadLength: 10000

metrics:
    prometheus:
        enabled: false
        endpoint: /metrics

plugins:
    lavasearch:
        sources:
            - spotify
            - youtube

    lavasrc:
        providers:
            - ytsearch:"%ISRC%"
            - ytsearch:%QUERY%
        sources:
            applemusic: false
            deezer: false
            flowerytts: false
            spotify: true
            yandexmusic: false
            youtube: true
        spotify:
            albumLoadLimit: 10
            clientId: "${SPOTIFY_CLIENT_ID}"
            clientSecret: "${SPOTIFY_CLIENT_SECRET}"
            countryCode: US
            customTokenEndpoint: null
            localFiles: false
            playlistLoadLimit: 10
            preferPartnerApi: false
            preferV1SearchApi: false
            resolveArtistsInSearch: false
            spDc: null

    youtube:
        allowDirectPlaylistIds: true
        allowDirectVideoIds: true
        allowSearch: true
        clients:
            - WEB
            - TV
            - TVHTML5_SIMPLY
            - ANDROID_VR
            - MWEB
            - WEBEMBEDDED
            - ANDROID_MUSIC
        enabled: true
        oauth:
            enabled: true
            refreshToken: "${YOUTUBE_REFRESH_TOKEN}"
            skipInitialization: false
        remoteCipher:
            url: https://cipher.bloxcraftcreations.dpdns.org/
            userAgent: lavalink-server

sentry:
    dsn: ""
    environment: ""

server:
    address: 0.0.0.0
    http2:
        enabled: false
    port: ${PORT:10000}
